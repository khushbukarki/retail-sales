name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: End-to-end run on synthetic data
        run: |
          python -m src.load_data --synthetic --db /tmp/ci.db
          python -m src.report --db /tmp/ci.db
